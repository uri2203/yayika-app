name: UI real Android (5 idiomas)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ui-test-x86.yml'
      - 'qa/appium-ui-test.mjs'

concurrency:
  group: ui-test-x86-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK
        run: |
          set -e
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Install dependencies and Appium
        run: |
          npm ci
          npm install -g appium appium-uiautomator2-driver --no-audit --no-fund
          appium driver install uiautomator2

      - name: Create and boot emulator
        run: |
          set -e
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo no | avdmanager create avd -n yayika -k "system-images;android-35;google_apis;x86_64" -d pixel_6 --force
          emulator -avd yayika -no-window -noaudio -no-boot-anim -port 5554 > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then echo "BOOT OK"; break; fi
            sleep 5
          done
          adb shell settings put secure lock_screen_lock_after_timeout 0
          adb shell settings put system screen_off_timeout 2147483647

      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RUN=$(gh api repos/${{ github.repository }}/actions/runs --jq '.workflow_runs[] | select(.name=="Build Android APK (x86_64)" and .conclusion=="success") | .id' | head -1)
          gh api repos/${{ github.repository }}/actions/runs/$RUN/artifacts --jq '.artifacts[] | select(.name=="yayika-app-x86_64") | .id' > /tmp/artid
          gh api repos/${{ github.repository }}/actions/artifacts/$(cat /tmp/artid)/zip > /tmp/apk.zip
          unzip -q /tmp/apk.zip -d /tmp/apk
          APK=$(find /tmp/apk -name '*.apk' | head -1)
          echo "YAYIKA_APK=$APK" >> $GITHUB_ENV

      - name: Start Appium
        run: |
          appium --base-path / > /tmp/appium.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4723/status > /dev/null; then echo "APPIUM OK"; break; fi
            sleep 2
          done

      - name: Run real UI tests (5 languages)
        env:
          YAYIKA_TEST_EMAIL: test@yayika.com
          YAYIKA_TEST_PASSWORD: Yayika2026
        run: node qa/appium-ui-test.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-results
          path: qa/results/ui
          retention-days: 14
