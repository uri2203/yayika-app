name: UI real Android (5 idiomas)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ui-test-x86.yml'
      - 'qa/appium-ui-test.mjs'

permissions:
  actions: read
  contents: read

concurrency:
  group: ui-test-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RUN=$(gh api repos/${{ github.repository }}/actions/runs --jq '.workflow_runs[] | select(.name=="Build Android APK (x86_64)" and .conclusion=="success") | .id' | head -1)
          echo "Usando run de build: $RUN"
          ART=$(gh api repos/${{ github.repository }}/actions/runs/$RUN/artifacts --jq '.artifacts[] | select(.name=="yayika-app-x86_64") | .id' | head -1)
          gh api repos/${{ github.repository }}/actions/artifacts/$ART/zip > /tmp/apk.zip
          unzip -q /tmp/apk.zip -d /tmp/apk
          APK=$(find /tmp/apk -name '*.apk' | head -1)
          echo "YAYIKA_APK=$APK" >> $GITHUB_ENV
          echo "APK: $APK"

      - name: Emulator + Appium + UI tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          script: |
            set -e
            npm install -g appium@4.0.1 --no-audit --no-fund
            appium driver install uiautomator2
            appium --base-path / > /tmp/appium.log 2>&1 &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status > /dev/null && break; sleep 2; done; echo "APPIUM listo"
            adb shell settings put secure lock_screen_lock_after_timeout 0
            adb shell settings put system screen_off_timeout 2147483647
            YAYIKA_TEST_EMAIL=test@yayika.com \
            YAYIKA_TEST_PASSWORD=Yayika2026 \
            node qa/appium-ui-test.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-results
          path: qa/results/ui
          retention-days: 14
