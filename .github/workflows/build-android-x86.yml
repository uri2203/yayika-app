name: Build Android APK (x86_64)
# Compilación en la nube: evita consumir RAM local (8 GB).

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/build-android-x86.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Build x86_64 APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Verify ABI
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -E 'lib/x86_64|lib/arm64' || true
          test -f "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: yayika-app-x86_64
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
